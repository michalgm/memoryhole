---
# ============================================================================
# Instance Upgrade Playbook
# ============================================================================
# Pulls latest images and restarts all instances. Migrations run automatically.
# Each instance pulls the tag in its docker-compose.yml: global_image_tag if
# given, else instance.image_tag if set, else latest.
#
# Usage:
#   ansible-playbook upgrade-instances.yml
#
# To pin a specific image tag for all instances:
#   ansible-playbook upgrade-instances.yml -e global_image_tag=v0.26.0
# ============================================================================

- name: Upgrade Instances
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Set image tag
      ansible.builtin.replace:
        path: "{{ instances_base }}/{{ instance.domain }}/docker-compose.yml"
        regexp: "(image: ghcr\\.io/michalgm/memoryhole-(?:api|web)):\\S+"
        replace: "\\1:{{ global_image_tag | default(instance.image_tag | default('latest')) }}"
      loop: "{{ instances }}"
      loop_control:
        label: "{{ instance.domain }}"
        loop_var: instance

    - name: Pull latest images and restart stacks
      community.docker.docker_compose_v2:
        project_src: "{{ instances_base }}/{{ instance.domain }}"
        pull: always
        remove_orphans: true
        state: present
      become: true
      become_user: "{{ linux_username }}"
      register: compose_up
      loop: "{{ instances }}"
      loop_control:
        label: "{{ instance.domain }}"
        loop_var: instance

    # Removes every image no container uses, including old tagged releases
    # (pinned tags aren't "dangling", so the default prune would keep them).
    # Containers and volumes are left alone: stopped one-shot containers like
    # `console` stay, and nothing touches database data.
    - name: Remove unused Docker images and build cache
      community.docker.docker_prune:
        images: true
        images_filters:
          dangling: false
        builder_cache: true
        networks: true
      register: _prune

    - name: Show space reclaimed
      ansible.builtin.debug:
        msg: >-
          Removed {{ _prune.images | length }} image(s), reclaimed
          {{ ((_prune.images_space_reclaimed + _prune.builder_cache_space_reclaimed) / 1024 / 1024) | round(1) }} MB

    - name: Display status
      ansible.builtin.debug:
        msg: "{{ item.containers | map(attribute='Name') | zip(item.containers | map(attribute='Status')) | map('join', ': ') | list }}"
      loop: "{{ compose_up.results }}"
      loop_control:
        label: "{{ item.instance.domain }}"
