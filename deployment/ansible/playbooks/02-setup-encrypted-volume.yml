---
# ============================================================================
# Encrypted Volume Setup Playbook
# ============================================================================
# Creates a LUKS-encrypted loopback volume on the root disk. The loopback
# file (default: /encrypted.img) acts as the block device — no separate
# Linode volume required.
#
# /home/{{ linux_username }}, /var/lib/docker, and /var/lib/containerd are
# bind-mounted from the encrypted volume so instance data and Docker layers
# are encrypted at rest.
#
# SECURITY WARNINGS:
# - Store the passphrase in a secure location (password manager + offline)
# - There is no recovery without the passphrase — LUKS cannot be bypassed
#
# Usage:
#   ansible-playbook -i inventory.yml 02-setup-encrypted-volume.yml
#
# Prerequisites:
#   - Server initialized with 01-init-server.yml
#   - encrypted_loopback_size_gb fits within root disk free space (check: df -h /)
# ============================================================================

- name: Setup Encrypted Loopback Volume with LUKS
  hosts: all
  become: true
  gather_facts: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

  pre_tasks:
    - name: Notify user that encrypted volume is disabled and skip
      when: not (use_encrypted_volume)
      block:
        - name: Encrypted volume not enabled
          ansible.builtin.debug:
            msg: |
              Encrypted volume is disabled (use_encrypted_volume is false or not set).
              Skipping encrypted volume setup. To enable, set in group_vars/all/main.yml:
                use_encrypted_volume: true
                encrypted_volume_passphrase: <strong-passphrase>

        - name: End play - Encrypted volume not configured
          ansible.builtin.meta: end_play

    - name: Check if encrypted volume is already mounted
      ansible.builtin.command: mountpoint -q {{ encrypted_volume_mount }}
      register: _volume_mounted
      failed_when: false
      changed_when: false

    - name: Verify required encryption variables
      ansible.builtin.assert:
        that:
          - encrypted_volume_name is defined and encrypted_volume_name | length > 0
          - encrypted_volume_mount is defined and encrypted_volume_mount | length > 0
          - encrypted_volume_passphrase is defined and encrypted_volume_passphrase | length > 0
          - encrypted_volume_passphrase != "CHANGE_ME_GENERATE_STRONG_PASSPHRASE"
        fail_msg: |
          use_encrypted_volume is true but required variables are missing or have placeholder values.
          Check group_vars/all/main.yml for: encrypted_volume_name, encrypted_volume_mount,
          encrypted_volume_passphrase
      when: _volume_mounted.rc != 0

    - name: Check if loopback file already exists
      ansible.builtin.stat:
        path: "{{ encrypted_loopback_file }}"
        get_checksum: false
        get_mime: false
      register: _loopback_file

    - name: Check if loopback file is already LUKS formatted
      ansible.builtin.command: cryptsetup isLuks {{ encrypted_loopback_file }}
      register: _is_luks
      failed_when: false
      changed_when: false
      when: _loopback_file.stat.exists

  tasks:
    # ==========================================================================
    # LOOPBACK FILE CREATION
    # ==========================================================================

    - name: Create loopback file
      ansible.builtin.command: fallocate -l {{ encrypted_loopback_size_gb }}G {{ encrypted_loopback_file }}
      args:
        creates: "{{ encrypted_loopback_file }}"

    - name: Restrict loopback file permissions
      ansible.builtin.file:
        path: "{{ encrypted_loopback_file }}"
        mode: "0600"
        owner: root
        group: root

    # ==========================================================================
    # LUKS ENCRYPTION SETUP
    # ==========================================================================

    - name: Find or attach loop device
      ansible.builtin.shell: |
        set -o pipefail
        existing=$(losetup -j {{ encrypted_loopback_file }} 2>/dev/null | cut -d: -f1 | head -1)
        if [[ -n "$existing" ]]; then
          # Ensure direct-io is enabled on existing device
          losetup --direct-io=on "$existing" 2>/dev/null || true
          echo "$existing"
        else
          losetup -f --show --direct-io=on {{ encrypted_loopback_file }}
        fi
      args:
        executable: /bin/bash
      register: _loop_device
      changed_when: false

    - name: Format loopback device with LUKS
      ansible.builtin.shell: |
        set -o pipefail
        printf '%s' "{{ encrypted_volume_passphrase }}" | \
        cryptsetup luksFormat \
          --cipher {{ luks_cipher }} \
          --key-size {{ luks_key_size }} \
          --hash {{ luks_hash }} \
          --iter-time {{ luks_iter_time }} \
          --pbkdf-memory {{ luks_pbkdf_memory_kb }} \
          --use-urandom \
          --batch-mode \
          {{ _loop_device.stdout }} -
      args:
        executable: /bin/bash
      when:
        - _is_luks is not defined or _is_luks.rc | default(1) != 0
      changed_when: true
      no_log: true

    - name: Check if LUKS volume is already open
      ansible.builtin.command: cryptsetup status {{ encrypted_volume_name }}
      register: _luks_status
      failed_when: false
      changed_when: false

    - name: Open LUKS volume
      ansible.builtin.shell: |
        set -o pipefail
        printf '%s' "{{ encrypted_volume_passphrase }}" | \
        cryptsetup luksOpen \
          --perf-no_read_workqueue \
          --perf-no_write_workqueue \
          {{ _loop_device.stdout }} {{ encrypted_volume_name }} -
      args:
        executable: /bin/bash
      when: _luks_status.rc != 0
      changed_when: true
      no_log: true

    # ==========================================================================
    # FILESYSTEM CREATION
    # ==========================================================================

    - name: Check if filesystem exists
      ansible.builtin.shell: set -o pipefail && blkid /dev/mapper/{{ encrypted_volume_name }} | grep ext4
      args:
        executable: /bin/bash
      register: _has_filesystem
      failed_when: false
      changed_when: false

    - name: Create ext4 filesystem on encrypted volume
      community.general.filesystem:
        fstype: ext4
        dev: /dev/mapper/{{ encrypted_volume_name }}
        opts: -L {{ encrypted_volume_name }}
      when: _has_filesystem.rc != 0

    - name: Create mount point directory
      ansible.builtin.file:
        path: "{{ encrypted_volume_mount }}"
        state: directory
        mode: "0755"

    - name: Mount encrypted volume
      ansible.posix.mount:
        path: "{{ encrypted_volume_mount }}"
        src: /dev/mapper/{{ encrypted_volume_name }}
        fstype: ext4
        opts: defaults,noatime,data=writeback,nofail,x-systemd.device-timeout=5s,x-systemd.mount-timeout=5s
        state: mounted

    # ==========================================================================
    # DIRECTORY STRUCTURE & BIND MOUNTS
    # ==========================================================================

    - name: Create base directories on encrypted volume
      ansible.builtin.file:
        path: "{{ encrypted_volume_mount }}/{{ item.path }}"
        state: directory
        mode: "{{ item.mode | default('0755') }}"
      loop:
        - { path: "home/{{ linux_username }}", mode: "0750" }
        - { path: "var/lib/docker", mode: "0710" }
        - { path: "var/lib/containerd", mode: "0710" }

    # rsync runs locally on the host; the synchronize module is for controller-to-host copies
    - name: Sync existing user homedir to encrypted volume
      ansible.builtin.command: rsync -aHAX /home/{{ linux_username }}/ {{ encrypted_volume_mount }}/home/{{ linux_username }}/ # noqa: command-instead-of-module
      args:
        creates: "{{ encrypted_volume_mount }}/home/{{ linux_username }}/.profile"

    - name: Set ownership of user homedir on encrypted volume
      ansible.builtin.file:
        path: "{{ encrypted_volume_mount }}/home/{{ linux_username }}"
        owner: "{{ linux_username }}"
        group: "{{ linux_username }}"
        recurse: false

    - name: Bind mount user homedir
      ansible.posix.mount:
        path: "/home/{{ linux_username }}"
        src: "{{ encrypted_volume_mount }}/home/{{ linux_username }}"
        opts: bind,nofail,x-systemd.mount-timeout=5s
        state: mounted
        fstype: none

    - name: Create /var/lib/docker directory
      ansible.builtin.file:
        path: /var/lib/docker
        state: directory
        mode: "0710"

    - name: Bind mount /var/lib/docker
      ansible.posix.mount:
        path: /var/lib/docker
        src: "{{ encrypted_volume_mount }}/var/lib/docker"
        opts: bind,nofail,x-systemd.mount-timeout=5s
        state: mounted
        fstype: none

    - name: Create /var/lib/containerd directory
      ansible.builtin.file:
        path: /var/lib/containerd
        state: directory
        mode: "0710"

    - name: Bind mount /var/lib/containerd
      ansible.posix.mount:
        path: /var/lib/containerd
        src: "{{ encrypted_volume_mount }}/var/lib/containerd"
        opts: bind,nofail,x-systemd.mount-timeout=5s
        state: mounted
        fstype: none

    # ==========================================================================
    # ADDITIONAL SWAP LOOPBACK FILE
    # ==========================================================================

    - name: Stat additional swap loopback file
      ansible.builtin.stat:
        path: "{{ encrypted_swap_file }}"
      register: _swap_loopback_stat

    - name: Create additional swap loopback file
      ansible.builtin.command: fallocate -l {{ swap_size_gb | default(2) }}G {{ encrypted_swap_file }}
      args:
        creates: "{{ encrypted_swap_file }}"

    - name: Restrict swap loopback file permissions
      ansible.builtin.file:
        path: "{{ encrypted_swap_file }}"
        mode: "0600"
        owner: root
        group: root

    - name: Format swap loopback file
      ansible.builtin.command: mkswap {{ encrypted_swap_file }}
      when: not _swap_loopback_stat.stat.exists
      changed_when: true

    # ==========================================================================
    # ENCRYPT ALL SWAP
    #
    # Collects plain swap devices (loopback file + any provider swap partition),
    # registers each in crypttab with a random ephemeral key, removes the plain
    # fstab entry, and adds the mapper device entry. All steps are idempotent
    # via crypttab lineinfile + mount module state management.
    # ==========================================================================

    - name: Collect plain swap devices to encrypt
      ansible.builtin.shell: |
        # Emit: <name> <device> for each plain swap not yet a mapper device
        idx=0
        while read -r device _ _; do
          [[ "$device" == /dev/mapper/* ]] && continue
          # Resolve UUID= or LABEL= to actual block device path
          if [[ "$device" == UUID=* || "$device" == LABEL=* ]]; then
            device=$(blkid -o device -l -t "$device" 2>/dev/null || echo "$device")
          fi
          echo "encrypted_swap${idx} ${device}"
          idx=$((idx + 1))
        done < <(grep -E '^[^#]\S+\s+\S+\s+swap\s' /etc/fstab 2>/dev/null)
        # Also include the swap loopback file if not already in fstab
        if ! grep -q "{{ encrypted_swap_file }}" /etc/fstab && \
           ! grep -q "{{ encrypted_swap_file }}" /etc/crypttab 2>/dev/null; then
          echo "encrypted_swap${idx} {{ encrypted_swap_file }}"
        fi
      args:
        executable: /bin/bash
      register: _plain_swap_devices
      changed_when: false

    - name: Register plain swap devices in crypttab
      ansible.builtin.lineinfile:
        path: /etc/crypttab
        regexp: "^{{ item.split()[0] }}\\s"
        line: "{{ item.split()[0] }} {{ item.split()[1] }} /dev/urandom swap,cipher=aes-xts-plain64,size=256,nofail"
        create: true
        mode: "0600"
      loop: "{{ _plain_swap_devices.stdout_lines }}"
      notify: Reload systemd

    - name: Remove plain swap entries from fstab
      ansible.posix.mount:
        path: none
        src: "{{ item.split()[1] }}"
        fstype: swap
        state: absent
      loop: "{{ _plain_swap_devices.stdout_lines }}"

    - name: Add encrypted mapper swap entries to fstab
      ansible.posix.mount:
        path: none
        src: "/dev/mapper/{{ item.split()[0] }}"
        fstype: swap
        opts: sw
        state: present
      loop: "{{ _plain_swap_devices.stdout_lines }}"

    - name: Flush handlers to reload systemd before starting swap
      ansible.builtin.meta: flush_handlers

    - name: Disable any still-active unencrypted swap
      ansible.builtin.shell: |
        set -o pipefail
        swapon --show=NAME --noheadings 2>/dev/null | while IFS= read -r dev; do
          [[ "$dev" == /dev/mapper/* ]] && continue
          swapoff "$dev" 2>/dev/null || true
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Collect encrypted swap mapping names
      ansible.builtin.shell: set -o pipefail && grep -E '^encrypted_swap[0-9]* ' /etc/crypttab 2>/dev/null | awk '{print $1}'
      args:
        executable: /bin/bash
      register: _swap_names
      changed_when: false

    - name: Start and verify encrypted swap mappings
      ansible.builtin.systemd:
        name: "systemd-cryptsetup@{{ item }}.service"
        state: started
      loop: "{{ _swap_names.stdout_lines }}"

    - name: Wait for encrypted swap device nodes to be ready
      ansible.builtin.wait_for:
        path: "/dev/mapper/{{ item }}"
        timeout: 30
      loop: "{{ _swap_names.stdout_lines }}"

    - name: Activate and verify encrypted swap
      ansible.builtin.shell: |
        set -o pipefail
        swapon /dev/mapper/{{ item }} 2>/dev/null || true
        cat /proc/swaps | grep -q "$(readlink -f /dev/mapper/{{ item }})"
      args:
        executable: /bin/bash
      loop: "{{ _swap_names.stdout_lines }}"
      changed_when: false

    # ==========================================================================
    # UNLOCK & LOCK SCRIPT
    # ==========================================================================

    - name: Create unlock/lock script
      ansible.builtin.template:
        src: scripts/unlock_data.sh.j2
        dest: /usr/local/bin/unlock_data
        mode: "0755"

    - name: Create admin-unlock user
      ansible.builtin.user:
        name: admin-unlock
        comment: "Encrypted Volume Unlock Admin"
        shell: /bin/bash
        create_home: true
        password_lock: true

    - name: Set up SSH authorized key for admin-unlock
      ansible.posix.authorized_key:
        user: admin-unlock
        state: present
        key: "{{ lookup('file', linux_user_ssh_key_file) }}"

    - name: Allow admin-unlock to run unlock script without password
      ansible.builtin.copy:
        dest: /etc/sudoers.d/admin-unlock
        content: |
          admin-unlock ALL=(root) NOPASSWD: /usr/local/bin/unlock_data
        mode: "0440"
        validate: "visudo -cf %s"

    # ==========================================================================
    # SUMMARY
    # ==========================================================================

    - name: Display encryption summary
      ansible.builtin.debug:
        msg: "{{ _summary.split('\n') }}"
      vars:
        _summary: |
          ==========================================
          Encrypted Volume Setup Complete
          ==========================================
          Loopback file: {{ encrypted_loopback_file }} ({{ encrypted_loopback_size_gb }} GB)
          Loop device:   {{ _loop_device.stdout }}
          Mapper:        /dev/mapper/{{ encrypted_volume_name }}
          Mount:         {{ encrypted_volume_mount }}

          ⚠️  CRITICAL: Store your passphrase securely — there is no recovery without it.

          Manual unlock after reboot:
            sudo /usr/local/bin/unlock_data unlock
          ==========================================

    - name: Save encryption info to file
      ansible.builtin.copy:
        dest: "{{ encrypted_volume_mount }}/.encryption-info.txt"
        content: |
          LUKS Encrypted Loopback Volume
          ==============================
          Loopback file: {{ encrypted_loopback_file }}
          Size: {{ encrypted_loopback_size_gb }} GB
          Mapper name: {{ encrypted_volume_name }}
          Mount point: {{ encrypted_volume_mount }}
          Cipher: {{ luks_cipher }}
          Key size: {{ luks_key_size }}

          Manual Unlock:
            sudo /usr/local/bin/unlock_data unlock

          Manual Lock:
            sudo /usr/local/bin/unlock_data lock
        mode: "0600"
