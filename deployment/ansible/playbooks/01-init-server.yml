---
# ============================================================================
# Initial Server Setup Playbook
# ============================================================================
# This playbook performs the initial configuration of a fresh server:
# - Creates admin user with sudo access
# - Sets up SSH key-based authentication
# - Configures basic security settings
# - Sets timezone and hostname
#
# Usage:
#   ansible-playbook -i inventory.yml 01-init-server.yml
#
# Requirements:
#   - Root SSH access to target server
#   - Updated inventory.yml with server details
#   - Updated group_vars/all.yml with your configuration
# ============================================================================

- name: Initialize New Server
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify required variables are set
      ansible.builtin.assert:
        that:
          - linux_username is defined
          - linux_user_ssh_key_file is defined
        fail_msg: "Required variables not set. Check group_vars/all.yml"

  tasks:
    # ==========================================================================
    # SYSTEM UPDATES
    # ==========================================================================

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true

    - name: Install essential packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - vim
          - tmux
          - htop
          - net-tools
          - build-essential
          - python3
          - python3-pip
          - ufw
          - fail2ban
          - unattended-upgrades
          - apt-listchanges
          - cryptsetup
          - lvm2
        state: present

    - name: Clean apt package cache
      ansible.builtin.apt:
        clean: true

    - name: Set timezone to UTC
      community.general.timezone:
        name: UTC

    # ==========================================================================
    # USER MANAGEMENT
    # ==========================================================================

    - name: Create admin user
      ansible.builtin.user:
        name: "{{ linux_username }}"
        shell: /bin/bash
        create_home: true
        state: present

    - name: Create .ssh directory for admin user
      ansible.builtin.file:
        path: "/home/{{ linux_username }}/.ssh"
        state: directory
        owner: "{{ linux_username }}"
        group: "{{ linux_username }}"
        mode: "0700"

    - name: Add SSH public key for admin user
      ansible.posix.authorized_key:
        user: "{{ linux_username }}"
        key: "{{ lookup('file', linux_user_ssh_key_file) }}"
        state: present

    # ==========================================================================
    # AUTOMATIC UPDATES CONFIGURATION
    # ==========================================================================

    - name: Configure unattended-upgrades
      ansible.builtin.template:
        src: templates/50unattended-upgrades.j2
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        mode: "0644"
      when: auto_updates_enabled | default(true)

    - name: Enable automatic updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"
      when: auto_updates_enabled | default(true)
