---
# Default values for all deployments.
# These are sensible defaults that rarely need changing.
# Override any of these in group_vars/all.yml if needed.

# ==============================================================================
# LINODE PROVISIONING (provision.yml only)
# ==============================================================================

linode_label: memoryhole
linode_region: eu-central
linode_type: g6-nanode-1
linode_image: linode/ubuntu26.04
linode_tags: [memoryhole, encrypted, production]
# Swap disk size in MB (the Linode default is 512). Set when the Linode is
# created; changing it later doesn't resize an existing Linode's swap.
linode_swap_partition_size: 2048
# Addresses allowed to SSH through the Linode Cloud Firewall
ssh_allowed_ips: ["0.0.0.0/0"]
ssh_public_key_path: ~/.ssh/id_rsa.pub

# ==============================================================================
# USER CONFIGURATION
# ==============================================================================

# Service account for running Docker instances
linux_username: memoryhole

# Each instance's compose project lives in <instances_base>/<domain>
instances_base: "/home/{{ linux_username }}/instances"

# Internal localhost port Caddy proxies each instance to (not exposed outside
# the server). Derived from the domain's SHA1 hash, range 8080-8979, so it's
# stable across list reorders. Set instance.port to override. Only valid
# inside a loop over instances with loop_var: instance.
instance_port: "{{ instance.port | default(((instance.domain | hash('sha1'))[0:3] | int(base=16) % 900) + 8080) }}"

# Prints the number of users in an instance's database. Run it in the
# instance's directory as linux_username.
instance_user_count_cmd: >-
  docker compose exec -T db psql -U memoryhole -d memoryhole -tAc 'SELECT COUNT(*) FROM "User";'

# ==============================================================================
# SSH CONFIGURATION
# ==============================================================================

ssh_port: 22
ssh_allow_password_auth: false
ssh_permit_root_login: "yes" # Intentionally kept enabled — Ansible connects as root (key-only)
ssh_max_auth_tries: 3
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 2

disable_root_login: false

# ==============================================================================
# FIREWALL (UFW)
# ==============================================================================

firewall_allowed_tcp_ports:
  - "{{ ssh_port }}"
  - "80"
  - "443"

firewall_allowed_udp_ports: []
firewall_rate_limit_ssh: true

# ==============================================================================
# FAIL2BAN
# ==============================================================================

fail2ban_enabled: true
fail2ban_bantime: 3600 # 1 hour
fail2ban_findtime: 600 # 10 minutes
fail2ban_maxretry: 5
# Caddy jails (see 04-setup-caddy.yml)
fail2ban_auth_maxretry: 10 # failed logins per findtime before ban
fail2ban_scan_maxretry: 3 # probe requests (.php, .env, wp-admin...) per findtime
fail2ban_scan_bantime: 86400 # 1 day

# ==============================================================================
# ENCRYPTED VOLUME
# ==============================================================================

use_encrypted_volume: true
encrypted_volume_name: encrypted_data
encrypted_volume_mount: /mnt/encrypted
use_luks_keyfile: false

# Loopback file used as the LUKS container (lives on the root disk).
# Size guidance for Linode plans:
#   nanode  (25 GB root):  13 GB  — leaves ~ 5GB for OS + growth
#   linode2 (50 GB root):  33 GB
#   linode4 (80 GB root):  58 GB
encrypted_loopback_file: /encrypted.img
encrypted_loopback_size_gb: 13

# Optional swap file, encrypted via crypttab alongside any existing swap
# partition. Off by default: swap on a file needs a loop device on the root
# filesystem, which can deadlock the server when memory runs out (and swap is
# needed most). Prefer a real swap partition (on Linode: linode_swap_partition_size).
# Only set this on hosts with no swap partition.
encrypted_swap_file: /swap.img
swap_file_size_gb: 0

# Advanced LUKS settings
luks_cipher: aes-xts-plain64
luks_key_size: 512
luks_hash: sha512
luks_iter_time: 5000
# Argon2id memory cap in KB. The LUKS2 default can exceed available RAM on
# small instances — 262144 (256 MB) is safe for a nanode with Docker running.
luks_pbkdf_memory_kb: 262144

# ==============================================================================
# DOCKER
# ==============================================================================

docker_users:
  - "{{ linux_username }}"

# Per-container memory caps, so one runaway container is OOM-killed instead
# of exhausting the host's memory. Override per instance with mem_limits.
# Check actual usage with: docker stats --no-stream
container_mem_limits:
  db: 384m
  api: 768m # also runs migrations and the seed
  web: 128m
  protonmail-bridge: 384m

# ==============================================================================
# CADDY
# ==============================================================================

caddy_acme_email: "{{ admin_user_email }}"

# ==============================================================================
# SECURITY & MONITORING
# ==============================================================================

auto_updates_enabled: true
auto_updates_reboot: false
auto_updates_time: "03:00"

enable_monitoring: true
monitoring_email: "{{ admin_user_email }}"

log_retention_days: 30
