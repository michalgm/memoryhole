---
# ============================================================================
# DEPROVISION - Delete Linode infrastructure
# ============================================================================
# Deletes the Linode instance and its Cloud Firewall (both created by
# provision.yml) via the linode.cloud Ansible collection.
#
# Run deprovision.yml first to securely wipe the data while the server is
# still reachable. Deleting a Linode doesn't guarantee its disk is erased.
#
# Usage:
#   ansible-playbook -i inventory.yml deprovision-linode.yml \
#     --extra-vars "confirm_destroy=yes"
#
# The Linode instance label is read from your inventory (the host name set by
# provision.yml). Override only if your label differs: --extra-vars "linode_label=my-server"
#
# Linode API token: from the LINODE_TOKEN environment variable, or prompted for.
# ============================================================================

- name: Delete Linode infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Force the playbook python so the linode.cloud collection finds linode_api4
    # regardless of whether Ansible was installed via pipx, brew, or apt.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

    # provision.yml names the inventory host entry after linode_label, so the
    # first non-localhost host in inventory IS the label. Override with
    # -e linode_label=... if needed.
    linode_label: "{{ (groups['all'] | difference(['localhost'])) | first }}"
    # Same naming as provision.yml
    firewall_label: "{{ linode_label }}-firewall"

  pre_tasks:
    - name: Require explicit confirmation
      ansible.builtin.assert:
        that:
          - confirm_destroy is defined
          - confirm_destroy | bool
        fail_msg: |
          DESTRUCTION CONFIRMATION REQUIRED

          This playbook will permanently delete:
            - Linode instance: {{ linode_label }}
            - Cloud Firewall: {{ firewall_label }}

          THIS CANNOT BE UNDONE.

          To proceed: --extra-vars "confirm_destroy=yes"

  tasks:
    - name: Set Linode API token
      ansible.builtin.set_fact:
        linode_api_token: '{{ lookup("env", "LINODE_TOKEN") }}'
      no_log: true

    - name: Prompt for Linode API token
      ansible.builtin.pause:
        prompt: |2

          Linode API token (LINODE_TOKEN is not set)

          Token
        echo: false
      register: _linode_token_prompt
      when: linode_api_token == ''

    - name: Set Linode API token from prompt
      ansible.builtin.set_fact:
        linode_api_token: "{{ _linode_token_prompt.user_input }}"
      when: linode_api_token == ''
      no_log: true

    - name: Verify Linode token is available
      ansible.builtin.assert:
        that: linode_api_token != ''
        fail_msg: "A Linode API token is required: set LINODE_TOKEN or enter one at the prompt."

    - name: Delete Linode instance
      linode.cloud.instance:
        api_token: "{{ linode_api_token }}"
        label: "{{ linode_label }}"
        state: absent

    # Deleting the instance detaches the firewall, so delete it afterwards
    - name: Delete Cloud Firewall
      linode.cloud.firewall:
        api_token: "{{ linode_api_token }}"
        label: "{{ firewall_label }}"
        state: absent

    - name: Deprovision complete
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Linode deprovision complete"
          - "=========================================="
          - "Instance ({{ linode_label }}): deleted"
          - "Firewall ({{ firewall_label }}): deleted"
          - ""
          - "inventory.yml still points at the deleted server. Delete it,"
          - "or provision a replacement (it keeps the same name and updates"
          - "the IP in inventory.yml):"
          - "  ansible-playbook provision.yml -e linode_label={{ linode_label }}"
          - "  ansible-playbook -i inventory.yml deploy.yml"
          - "=========================================="
