---
- name: Provision Memoryhole Infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Force use of the python interpreter that's running ansible-playbook
    # This ensures dependencies installed in the pipx venv (like linode_api4) are found
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

    # Defaults (override via -e or environment vars)
    linode_label: "memoryhole"
    linode_region: "eu-central"
    linode_type: "g6-nanode-1"
    linode_image: "linode/ubuntu24.04"
    linode_tags: ["memoryhole", "encrypted", "production"]

    # Firewall Configuration
    firewall_label: "{{ linode_label }}-firewall"
    ssh_allowed_ips: ["0.0.0.0/0"]
    ssh_port: 22

    # Authentication
    ssh_public_key_path: "~/.ssh/id_rsa.pub"
    root_password: "{{ lookup('env', 'ROOT_PASSWORD') | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32'), true) }}"

    # From the LINODE_TOKEN environment variable; prompted for if unset
    linode_token: "{{ lookup('env', 'LINODE_TOKEN') }}"

    inventory_file_path: "{{ playbook_dir }}/inventory.yml"
    inventory_host_entry: |
      {{ linode_label }}:
        ansible_host: {{ linode_ip }}
        ansible_user: root
        ansible_port: 22
        server_hostname: {{ linode_label }}.local

    # Alerts (optional)
    alert_email: "{{ lookup('env', 'ALERT_EMAIL') | default('', true) }}"

  tasks:
    # -------------------------------------------------------------------------
    # Prerequisites Checks
    # -------------------------------------------------------------------------
    - name: Prompt for Linode API token
      ansible.builtin.pause:
        prompt: |2

          Linode API token (LINODE_TOKEN is not set)
          Create one at https://cloud.linode.com/profile/tokens

          Token
        echo: false
      register: _linode_token_prompt
      when: linode_token == ""

    - name: Set Linode API token from prompt
      ansible.builtin.set_fact:
        linode_token: "{{ _linode_token_prompt.user_input }}"
      when: linode_token == ""
      no_log: true

    - name: Verify Linode API Token
      ansible.builtin.fail:
        msg: "A Linode API token is required: set LINODE_TOKEN or enter one at the prompt."
      when: linode_token == ""

    - name: Check for SSH public key
      ansible.builtin.stat:
        path: "{{ ssh_public_key_path }}"
      register: ssh_key_check

    - name: Fail if SSH key missing
      ansible.builtin.fail:
        msg: "SSH public key not found at {{ ssh_public_key_path }}"
      when: not ssh_key_check.stat.exists

    # Each repo clone manages exactly one server. Check before creating
    # anything, so a mistyped linode_label can't spin up a second Linode.
    - name: Check for existing inventory file
      ansible.builtin.stat:
        path: "{{ inventory_file_path }}"
      register: _inventory_file

    - name: Read existing inventory
      ansible.builtin.command: ansible-inventory -i {{ inventory_file_path }} --list
      register: _inventory_list
      changed_when: false
      when: _inventory_file.stat.exists

    - name: Set existing inventory hosts
      ansible.builtin.set_fact:
        _inventory_hostvars: "{{ (_inventory_list.stdout | from_json)._meta.hostvars | default({}) }}"
      when: _inventory_file.stat.exists

    - name: Fail if inventory manages a different server
      ansible.builtin.fail:
        msg: |
          inventory.yml already manages {{ _inventory_hostvars.keys() | join(', ') }}, not '{{ linode_label }}'.
          Each clone of this repo manages one server. To re-provision the existing
          server, run with -e linode_label={{ _inventory_hostvars.keys() | first }}.
          To manage a new server, use a separate clone.
      when:
        - _inventory_file.stat.exists
        - _inventory_hostvars.keys() | reject('equalto', linode_label) | list | length > 0

    # -------------------------------------------------------------------------
    # SSH Key Content
    # -------------------------------------------------------------------------
    - name: Read SSH public key
      ansible.builtin.set_fact:
        ssh_key_content: "{{ lookup('file', ssh_public_key_path) }}"

    # -------------------------------------------------------------------------
    # Linode Instance Provisioning
    # -------------------------------------------------------------------------
    - name: Create or Get Linode Instance
      linode.cloud.instance:
        api_token: "{{ linode_token }}"
        label: "{{ linode_label }}"
        type: "{{ linode_type }}"
        region: "{{ linode_region }}"
        image: "{{ linode_image }}"
        root_pass: "{{ root_password }}"
        authorized_keys: ["{{ ssh_key_content }}"]
        tags: "{{ linode_tags }}"
        state: present
        booted: true
        private_ip: true
      register: linode_instance

    - name: Wait for Linode to be running
      linode.cloud.instance:
        api_token: "{{ linode_token }}"
        label: "{{ linode_label }}"
        state: present
      register: instance_status
      until: instance_status.instance.status == 'running'
      retries: 30
      delay: 10

    - name: Extract Instance Details
      ansible.builtin.set_fact:
        linode_ip: "{{ linode_instance.instance.ipv4[0] }}"
        linode_id: "{{ linode_instance.instance.id }}"

    - name: Display Instance IP
      ansible.builtin.debug:
        msg: "Instance running at: {{ linode_ip }}"

    # -------------------------------------------------------------------------
    # Cloud Firewall
    # -------------------------------------------------------------------------
    - name: Create Firewall
      linode.cloud.firewall:
        api_token: "{{ linode_token }}"
        label: "{{ firewall_label }}"
        rules:
          inbound:
            - label: "allow-ssh"
              action: "ACCEPT"
              protocol: "TCP"
              ports: "{{ ssh_port }}"
              addresses:
                ipv4: "{{ ssh_allowed_ips }}"
            - label: "allow-http"
              action: "ACCEPT"
              protocol: "TCP"
              ports: "80"
              addresses:
                ipv4: ["0.0.0.0/0"]
                ipv6: ["::/0"]
            - label: "allow-https"
              action: "ACCEPT"
              protocol: "TCP"
              ports: "443"
              addresses:
                ipv4: ["0.0.0.0/0"]
                ipv6: ["::/0"]
          inbound_policy: "DROP"
          # outbound:
          #   - label: 'allow-all-outbound'
          #     action: 'ACCEPT'
          #     protocol: 'TCP'
          #     ports: '1-65535'
          #     addresses:
          #       ipv4: ['0.0.0.0/0']
          #       ipv6: ['::/0']
          #   - label: 'allow-all-outbound-udp'
          #     action: 'ACCEPT'
          #     protocol: 'UDP'
          #     ports: '1-65535'
          #     addresses:
          #       ipv4: ['0.0.0.0/0']
          #       ipv6: ['::/0']
          outbound_policy: "ACCEPT"
        tags: "{{ linode_tags }}"
        devices:
          - id: "{{ linode_id }}"
        state: present
      register: firewall

    # -------------------------------------------------------------------------
    # Output & Next Steps
    # -------------------------------------------------------------------------
    - name: Add new server to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ linode_label }}"
        groups: provisioned
        ansible_host: "{{ linode_ip }}"
        ansible_user: root
        ansible_port: 22
        server_hostname: "{{ linode_label }}.local"

    - name: Generate inventory file
      ansible.builtin.copy:
        content: |
          all:
            children:
              production:
                hosts:
          {{ inventory_host_entry | indent(8, first=true) }}
        dest: "{{ inventory_file_path }}"
        mode: "0600"
      when: not _inventory_file.stat.exists

    - name: Set existing inventory address
      ansible.builtin.set_fact:
        _inventory_address: "{{ _inventory_hostvars[linode_label].ansible_host | default('') }}"
      when: _inventory_file.stat.exists

    # Only rewrite an IP. A hostname in ansible_host was set deliberately
    # (e.g. DNS), so leave it and mention the new IP in the summary instead.
    - name: Update server IP in existing inventory
      ansible.builtin.replace:
        path: "{{ inventory_file_path }}"
        regexp: "^(\\s*ansible_host:\\s*)\\d{1,3}(\\.\\d{1,3}){3}\\s*$"
        replace: "\\g<1>{{ linode_ip }}"
      when:
        - _inventory_file.stat.exists
        - _inventory_address is match('^\d{1,3}(\.\d{1,3}){3}$')
        - _inventory_address != linode_ip

    - name: Provisioning Summary
      ansible.builtin.debug:
        msg: "{{ _summary.split('\n') }}"
      vars:
        _summary: |
          --------------------------------------------------------
           PROVISIONING COMPLETE
          --------------------------------------------------------
          Instance: {{ linode_label }} ({{ linode_id }}){{ '' if linode_instance.changed else ' (already existed)' }}
          IP Address: {{ linode_ip }}
          Firewall: {{ firewall_label }}
          --------------------------------------------------------
          {% if linode_instance.changed %}
          Root password: {{ root_password }}
          Save this — it cannot be recovered after this point.
          --------------------------------------------------------
          {% endif %}
          {% if not _inventory_file.stat.exists %}
          A generated inventory file has been saved to inventory.yml
          {% elif _inventory_address == linode_ip %}
          inventory.yml is up to date.
          {% elif _inventory_address is match('^\d{1,3}(\.\d{1,3}){3}$') %}
          inventory.yml updated: ansible_host {{ _inventory_address }} -> {{ linode_ip }}
          {% else %}
          inventory.yml uses ansible_host: {{ _inventory_address }} (not changed).
          Make sure it resolves to {{ linode_ip }}.
          {% endif %}
          To proceed with configuration:
            ansible-playbook -i inventory.yml deploy.yml

# ============================================================================
# Set hostname on the newly provisioned server
# ============================================================================
- name: Configure hostname on new server
  hosts: provisioned
  become: true
  gather_facts: false

  tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ server_hostname }}"

    - name: Update /etc/hosts with hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^127\\.0\\.1\\.1"
        line: "127.0.1.1 {{ server_hostname }}"
        state: present
