---
# ============================================================================
# DEPROVISION - Secure server cleanup
# ============================================================================
# Stops all Memoryhole instances and securely erases all data on the server.
#
# If disk encryption is enabled (use_encrypted_volume: true), the LUKS key
# slots are wiped — making all data permanently unrecoverable without needing
# to shred individual files, because /home and /var/lib/docker are already
# stored on the encrypted volume via bind mounts.
#
# If disk encryption is disabled, instance data directories are shredded
# before removal.
#
# Run this before deprovision-linode.yml, while the server is still reachable.
#
# Usage:
#   ansible-playbook -i inventory.yml deprovision.yml \
#     --extra-vars "confirm_destroy=yes"
# ============================================================================

- name: Secure server cleanup
  hosts: all
  become: true
  gather_facts: false

  vars:
    instances_base: "/home/{{ linux_username }}/instances"

  pre_tasks:
    - name: Require explicit confirmation
      ansible.builtin.assert:
        that:
          - confirm_destroy is defined
          - confirm_destroy | bool
        fail_msg: |
          DESTRUCTION CONFIRMATION REQUIRED

          This playbook will PERMANENTLY DELETE all Memoryhole data on:
            {{ inventory_hostname }}

          THIS CANNOT BE UNDONE.

          To proceed: --extra-vars "confirm_destroy=yes"

    - name: Final warning
      ansible.builtin.pause:
        seconds: 10
        prompt: |2

          ╔════════════════════════════════════════════════════════════════╗
          ║                       LAST WARNING                             ║
          ╠════════════════════════════════════════════════════════════════╣
          ║  About to permanently delete all data on:                      ║
          ║    {{ inventory_hostname }}                                    ║
          ║                                                                ║
          ║  Resuming in 10 seconds... Press Ctrl+C TWICE to cancel        ║
          ╚════════════════════════════════════════════════════════════════╝

  tasks:
    # --------------------------------------------------------------------------
    # STOP ALL INSTANCES
    # --------------------------------------------------------------------------

    - name: Stop and disable instance systemd services
      ansible.builtin.systemd:
        name: 'memoryhole-{{ instance.domain | replace(".", "-") }}'
        state: stopped
        enabled: false
      loop: "{{ instances | default([]) }}"
      loop_control:
        loop_var: instance
        label: "{{ instance.domain }}"
      register: _instance_services
      failed_when:
        - _instance_services is failed
        - "'Could not find the requested service' not in _instance_services.msg | default('')"

    - name: Stop all running Docker containers
      ansible.builtin.shell: |
        set -o pipefail
        command -v docker >/dev/null || exit 0
        docker ps -q | xargs -r docker stop
      args:
        executable: /bin/bash
      register: _stopped_containers
      changed_when: _stopped_containers.stdout | length > 0

    - name: Stop Docker service
      ansible.builtin.systemd:
        name: docker
        state: stopped
      register: _docker_service
      failed_when:
        - _docker_service is failed
        - "'Could not find the requested service' not in _docker_service.msg | default('')"

    # --------------------------------------------------------------------------
    # ENCRYPTED VOLUME: CRYPTO ERASE
    #
    # /home and /var/lib/docker are bind-mounted from the encrypted volume, so
    # all instance data and Docker layer data lives there. Overwriting the LUKS
    # header in the loopback file destroys the master key — the ciphertext on
    # disk becomes permanently unrecoverable without needing to shred individual
    # files. Overwriting 8 MB covers the full LUKS2 header area.
    # --------------------------------------------------------------------------

    - name: Force-unmount bind mounts backed by encrypted volume
      ansible.builtin.shell: |
        if mountpoint -q {{ item }}; then umount -l {{ item }} && echo unmounted; fi
      args:
        executable: /bin/bash
      loop:
        - /var/lib/containerd
        - /var/lib/docker
        - "/home/{{ linux_username }}"
      register: _bind_umount
      changed_when: "'unmounted' in _bind_umount.stdout"
      when: use_encrypted_volume | default(true)

    - name: Unmount encrypted volume
      ansible.builtin.shell: |
        if mountpoint -q {{ encrypted_volume_mount }}; then umount -l {{ encrypted_volume_mount }} && echo unmounted; fi
      args:
        executable: /bin/bash
      register: _volume_umount
      changed_when: "'unmounted' in _volume_umount.stdout"
      when: use_encrypted_volume | default(true)

    # Close and detach are best-effort: a lazily-unmounted filesystem can keep
    # the mapper busy, and that must not stop the header overwrite below, which
    # is what actually destroys the data.
    - name: Close LUKS mapper
      ansible.builtin.shell: |
        if cryptsetup status {{ encrypted_volume_name }} >/dev/null 2>&1; then
          cryptsetup close {{ encrypted_volume_name }} && echo closed
        fi
      args:
        executable: /bin/bash
      register: _luks_close
      changed_when: "'closed' in _luks_close.stdout"
      failed_when: false
      when: use_encrypted_volume | default(true)

    - name: Detach loop device
      ansible.builtin.shell: |
        set -o pipefail
        loop_dev=$(losetup -j {{ encrypted_loopback_file }} 2>/dev/null | cut -d: -f1 | head -1)
        if [[ -n "$loop_dev" ]]; then losetup -d "$loop_dev" && echo detached; fi
      args:
        executable: /bin/bash
      register: _loop_detach
      changed_when: "'detached' in _loop_detach.stdout"
      failed_when: false
      when: use_encrypted_volume | default(true)

    - name: Overwrite LUKS header in loopback file (crypto erase)
      ansible.builtin.command: dd if=/dev/urandom of={{ encrypted_loopback_file }} bs=1M count=8 conv=notrunc
      args:
        removes: "{{ encrypted_loopback_file }}"
      when: use_encrypted_volume | default(true)

    - name: Remove loopback file
      ansible.builtin.file:
        path: "{{ encrypted_loopback_file }}"
        state: absent
      when: use_encrypted_volume | default(true)

    # --------------------------------------------------------------------------
    # NO ENCRYPTION: SHRED DATA FILES
    # --------------------------------------------------------------------------

    - name: Shred instance data and remove directories
      ansible.builtin.shell: |
        set -e
        find '{{ instances_base }}/{{ instance.domain }}' -type f \
          -exec shred -uz {} \;
        rm -rf '{{ instances_base }}/{{ instance.domain }}'
      args:
        executable: /bin/bash
        removes: "{{ instances_base }}/{{ instance.domain }}"
      loop: "{{ instances | default([]) }}"
      loop_control:
        loop_var: instance
        label: "{{ instance.domain }}"
      when: not (use_encrypted_volume | default(true))

    # --------------------------------------------------------------------------
    # SUMMARY
    # --------------------------------------------------------------------------

    - name: Secure data wipe complete
      ansible.builtin.debug:
        msg: >-
          {{
            'LUKS key slots erased — all encrypted data is permanently unrecoverable.'
            if (use_encrypted_volume | default(true))
            else 'Instance data directories shredded.'
          }}
