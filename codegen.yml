schema: ".redwood/schema.graphql"
generates:
  ./web/src/test/mocks/generated.ts:
    plugins:
      - add:
          content: "/* eslint-disable @typescript-eslint/no-use-before-define,@typescript-eslint/no-unused-vars,no-prototype-builtins,@typescript-eslint/no-explicit-any */"
      - typescript
      - typescript-resolvers
      - typescript-mock-data:
          generateDefaultValues: true
          terminateCircularRelationships: true
          addTypename: true
          dynamicValues: true
          locale: "en_US"
          scalars:
            Date: date.past
            DateTime: date.past
            ID:
              generator: incrementalId
              increment: 1
              start: 1
          fieldGeneration:
            _all:
              first_name: person.firstName
              last_name: person.lastName
              preferred_name: person.firstName
              email: internet.email
              display_field: person.fullName
              search_field: person.fullName
              location: location.city
              jurisdiction: location.county
              arrest_city: location.city
              city: location.city
              state: location.state
              zip: location.zipCode
              address: location.streetAddress
              phone: phone.number
              phone_1: phone.number
              phone_2: phone.number
              name: faker.helpers.fake('{{word.adjective}} {{animal.type}}')
              pronoun: faker.helpers.arrayElement(["he/him","she/her","they/them"])
            User:
              name: person.fullName
            Arrestee:
              display_field: person.fullName
              search_display_field: person.fullName

